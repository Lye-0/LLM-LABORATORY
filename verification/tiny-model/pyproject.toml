[project]
name = "llm-laboratory-tiny-model-verification"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
  "torch==2.14.1+cpu",
  "filelock==3.32.3",
  "fsspec==2026.7.0",
  "jinja2==3.1.6",
  "markupsafe==3.0.3",
  "mpmath==1.3.0",
  "networkx==3.6.1",
  "sympy==1.14.0",
  "typing-extensions==4.16.0",
]

[tool.uv]
package = false
environments = ["sys_platform == 'win32' and platform_machine == 'AMD64'"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
